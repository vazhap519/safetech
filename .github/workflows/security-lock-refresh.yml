name: Security Lock Refresh

on:
  push:
    branches:
      - security-php-dependencies-phase-11
    paths:
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-composer-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: security-php-dependencies-phase-11
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify PHP and Composer
        run: |
          php --version
          composer --version

      - name: Refresh security-sensitive PHP dependencies
        run: |
          composer update filament/filament filament/spatie-laravel-media-library-plugin livewire/livewire league/commonmark --with-all-dependencies --no-interaction --no-progress
          composer audit --locked --no-interaction

      - name: Commit refreshed lock file
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add back/composer.lock
          git diff --cached --quiet && exit 0
          git commit -m "Update PHP dependencies for security advisories"
          git push origin HEAD:security-php-dependencies-phase-11
