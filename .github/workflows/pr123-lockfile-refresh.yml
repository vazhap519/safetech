name: Refresh PR123 npm lockfile

on:
  push:
    branches:
      - feat/seven-service-catalog-20261019
    paths:
      - frontend/package.json
      - .github/workflows/pr123-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seven-service-catalog-20261019
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate dependency lock file
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Commit reproducible lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'Lock patched Next.js dependencies at 16.4.3'
          git push origin HEAD:feat/seven-service-catalog-20261019
