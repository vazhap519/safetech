name: Pint formatter probe

on:
  push:
    branches: [agent/pint-debug]

permissions:
  contents: read

jobs:
  pint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply Pint to SEO audit
        run: vendor/bin/pint app/Support/Seo/SeoAudit.php
      - name: Show exact formatter diff
        run: git diff -- app/Support/Seo/SeoAudit.php || git diff -- back/app/Support/Seo/SeoAudit.php
