name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back
    env:
      APP_ENV: testing
      APP_KEY: "00000000000000000000000000000000"
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      SEED_DEMO_CONTENT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, gd, exif
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Reject tracked runtime uploads
        run: |
          if git ls-files 'storage/media-library/temp/**' | grep -q .; then
            echo 'Temporary media-library uploads must not be committed.' >&2
            exit 1
          fi

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Verify fresh database and seeders
        run: php artisan migrate:fresh --seed --force

      - name: Run Laravel tests
        run: php artisan test

  frontend:
    name: Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      # Builds must be deterministic and must not depend on the currently deployed API.
      BACKEND_API_URL: http://127.0.0.1:9/api
      NEXT_PUBLIC_API_URL: https://api.safetech.ge/api
      NEXT_PUBLIC_SITE_URL: https://safetech.ge
      REVALIDATE_SECRET: ci-only-revalidate-secret-not-used-in-production
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint, type-check, and build
        run: npm run check

      - name: Google SEO smoke test with unavailable CMS
        run: |
          npm run start -- -p 3000 > /tmp/safetech-next.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat /tmp/safetech-next.log
              exit 1
            fi
            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
            cat /tmp/safetech-next.log
            exit 1
          fi

          SEO_BASE_URL=http://127.0.0.1:3000 npm run seo:smoke

  deployment-script:
    name: Deployment script
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n deploy.sh
          bash -n scripts/deploy-production.sh
          bash -n scripts/repair-backend-runtime.sh
          bash -n scripts/bootstrap-github-actions-deploy.sh
          bash -n scripts/configure-ai-assistant.sh

      - name: Run ShellCheck
        run: shellcheck deploy.sh scripts/deploy-production.sh scripts/repair-backend-runtime.sh scripts/bootstrap-github-actions-deploy.sh scripts/configure-ai-assistant.sh

      - name: Verify deployment safeguards
        run: |
          grep -q 'FRONTEND_STAGE_DIR' scripts/deploy-production.sh
          grep -q 'FRONTEND_ROLLBACK_DIR' scripts/deploy-production.sh
          grep -q 'restore_frontend' scripts/deploy-production.sh
          grep -q 'install_systemd_units' scripts/deploy-production.sh
          grep -q 'install_nginx_config' scripts/deploy-production.sh
          grep -q 'Atomically activating the staged frontend' scripts/deploy-production.sh
          grep -q 'storage/framework/sessions' scripts/repair-backend-runtime.sh
          grep -q 'Filament admin login smoke test passed' deploy.sh
          grep -q 'restrict,command=' scripts/bootstrap-github-actions-deploy.sh
          grep -q 'requested SHA is not the current origin/main commit' scripts/bootstrap-github-actions-deploy.sh
          grep -q 'safetech-approved.git' scripts/bootstrap-github-actions-deploy.sh
          grep -q 'OPENAI_API_KEY' scripts/configure-ai-assistant.sh
          grep -q 'NEXT_PUBLIC_AI_ASSISTANT_ENABLED' scripts/configure-ai-assistant.sh
