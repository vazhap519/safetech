name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Laravel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: back
    env:
      APP_ENV: testing
      APP_KEY: "00000000000000000000000000000000"
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      SEED_DEMO_CONTENT: "false"
      COMPOSER_MAX_PARALLEL_HTTP: "4"
      COMPOSER_PROCESS_TIMEOUT: "1200"
      XDEBUG_MODE: "off"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reject committed OpenAI secrets
        run: |
          if git -C .. grep -nE 'sk-(proj|admin|svcacct)-[A-Za-z0-9_-]{20,}' -- .; then
            echo 'A value matching an OpenAI API key pattern is committed to the repository.' >&2
            exit 1
          fi

      - name: Verify runner PHP and Composer
        run: |
          php --version
          composer --version
          for extension in mbstring pdo_sqlite sqlite3 gd exif; do
            php -r "exit(extension_loaded('${extension}') ? 0 : 1);" || {
              echo "Missing required PHP extension: ${extension}" >&2
              exit 1
            }
          done

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Reject tracked runtime uploads
        run: |
          if git ls-files 'storage/media-library/temp/**' | grep -q .; then
            echo 'Temporary media-library uploads must not be committed.' >&2
            exit 1
          fi

      - name: Install PHP dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          if composer install --no-interaction --prefer-dist --no-progress; then
            exit 0
          fi

          sleep 20

          if composer install --no-interaction --prefer-dist --no-progress; then
            exit 0
          fi

          echo 'GitHub archive downloads are throttled; retrying the remaining locked packages from source.' >&2
          composer install --no-interaction --prefer-source --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Verify fresh database and seeders
        run: php artisan migrate:fresh --seed --force

      - name: Run Laravel tests
        run: php artisan test

  frontend:
    name: Next.js
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      # Builds must be deterministic and must not depend on the currently deployed API.
      BACKEND_API_URL: http://127.0.0.1:9/api
      NEXT_PUBLIC_API_URL: https://api.safetech.ge/api
      NEXT_PUBLIC_SITE_URL: https://safetech.ge
      REVALIDATE_SECRET: ci-only-revalidate-secret-not-used-in-production
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify runner Node.js
        run: |
          node --version
          npm --version
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 22) process.exit(1)'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Next.js security baseline
        run: |
          node - <<'NODE'
          const version = require('next/package.json').version;
          const parts = version.split('.').map(Number);
          const minimum = [16, 3, 3];
          const secure = parts[0] > minimum[0]
            || (parts[0] === minimum[0] && parts[1] > minimum[1])
            || (parts[0] === minimum[0] && parts[1] === minimum[1] && parts[2] >= minimum[2]);
          if (!secure) {
            console.error(`Next.js ${version} is below the SafeTech security baseline 16.3.3.`);
            process.exit(1);
          }
          console.log(`Next.js security baseline satisfied: ${version}`);
          NODE

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint, type-check, and build
        run: npm run check

      - name: Google SEO smoke test with unavailable CMS
        run: |
          npm run start -- -p 3000 > /tmp/safetech-next.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat /tmp/safetech-next.log
              exit 1
            fi
            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
            cat /tmp/safetech-next.log
            exit 1
          fi

          SEO_BASE_URL=http://127.0.0.1:3000 npm run seo:smoke

  deployment-script:
    name: Deployment script
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check shell syntax
        run: |
          bash -n deploy.sh
          bash -n scripts/deploy-production.sh
          bash -n scripts/repair-backend-runtime.sh
          bash -n scripts/bootstrap-github-actions-deploy.sh
          bash -n scripts/configure-ai-assistant.sh

      - name: Run ShellCheck
        run: shellcheck deploy.sh scripts/deploy-production.sh scripts/repair-backend-runtime.sh scripts/bootstrap-github-actions-deploy.sh scripts/configure-ai-assistant.sh

      - name: Verify deployment safeguards
        run: |
          grep -q 'FRONTEND_STAGE_DIR' scripts/deploy-production.sh
          grep -q 'FRONTEND_ROLLBACK_DIR' scripts/deploy-production.sh
          grep -q 'restore_frontend' scripts/deploy-production.sh
          grep -q 'install_systemd_units' scripts/deploy-production.sh
          grep -q 'install_nginx_config' scripts/deploy-production.sh
          grep -q 'Atomically activating the staged frontend' scripts/deploy-production.sh
          grep -q 'storage/framework/sessions' scripts/repair-backend-runtime.sh
          grep -q 'Filament admin login smoke test passed' deploy.sh
          grep -q 'restrict,command=' scripts/bootstrap-github-actions-deploy.sh
          grep -q 'requested SHA is not the current origin/main commit' scripts/bootstrap-github-actions-deploy.sh
          grep -q 'safetech-approved.git' scripts/bootstrap-github-actions-deploy.sh
          grep -q 'OPENAI_API_KEY' scripts/configure-ai-assistant.sh
          grep -q 'NEXT_PUBLIC_AI_ASSISTANT_ENABLED' scripts/configure-ai-assistant.sh
          grep -q 'safetech_marketing_consent' frontend/deploy/nginx/safetech.example.conf
          grep -q 'safetech_has_marketing_consent_cookie' frontend/deploy/nginx/safetech.example.conf
          if grep -q 'image/avif' frontend/next.config.ts; then
            echo 'AVIF optimization must stay disabled until SafeTech intentionally re-enables it after the 2026 advisory.' >&2
            exit 1
          fi
