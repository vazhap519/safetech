name: Apply atomic production deploy

on:
  push:
    branches:
      - fix/atomic-production-deploy
    paths:
      - ".github/workflows/apply-atomic-deploy.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/atomic-production-deploy
          fetch-depth: 0

      - name: Assemble hardened deployment scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d scripts
          cat .deploy-payload/chunk1.txt \
              .deploy-payload/chunk2.txt \
              .deploy-payload/chunk3.txt \
              .deploy-payload/chunk4.txt \
              .deploy-payload/chunk5.txt \
            | tr -d '\n' \
            | base64 --decode \
            > scripts/deploy-production.sh
          printf '%s' 'IyEvdXNyL2Jpbi9lbnYgYmFzaAoKc2V0IC1FZXVvIHBpcGVmYWlsCgpTQ1JJUFRfRElSPSIkKGNkIC0tICIkKGRpcm5hbWUgLS0gIiR7QkFTSF9TT1VSQ0VbMF19IikiICYmIHB3ZCkiCmV4ZWMgYmFzaCAiJHtTQ1JJUFRfRElSfS9zY3JpcHRzL2RlcGxveS1wcm9kdWN0aW9uLnNoIiAiJEAiCg==' \
            | base64 --decode \
            > deploy.sh
          chmod 0755 deploy.sh scripts/deploy-production.sh
          bash -n deploy.sh
          bash -n scripts/deploy-production.sh

      - name: Align repository deployment configuration
        shell: python
        run: |
          from pathlib import Path

          gitignore = Path('.gitignore')
          text = gitignore.read_text()
          if '.deploy/\n' not in text:
              text += '.deploy/\n'
          gitignore.write_text(text)

          nginx = Path('frontend/deploy/nginx/safetech.example.conf')
          text = nginx.read_text()
          text = text.replace(
              'root /var/www/safetech-api/public;',
              'root /var/www/safetech/back/public;',
          )
          nginx.write_text(text)

          quality = Path('.github/workflows/quality.yml')
          text = quality.read_text()
          text = text.replace(
              '      - name: Check shell syntax\n        run: bash -n deploy.sh\n\n      - name: Run ShellCheck\n        run: shellcheck deploy.sh',
              '      - name: Check shell syntax\n        run: |\n          bash -n deploy.sh\n          bash -n scripts/deploy-production.sh\n\n      - name: Run ShellCheck\n        run: shellcheck deploy.sh scripts/deploy-production.sh\n\n      - name: Verify atomic frontend deployment safeguards\n        run: |\n          grep -q "FRONTEND_STAGE_DIR" scripts/deploy-production.sh\n          grep -q "FRONTEND_ROLLBACK_DIR" scripts/deploy-production.sh\n          grep -q "restore_frontend" scripts/deploy-production.sh\n          grep -q "install_systemd_units" scripts/deploy-production.sh\n          grep -q "install_nginx_config" scripts/deploy-production.sh',
          )
          quality.write_text(text)

      - name: Remove temporary diagnostic payload
        run: |
          rm -rf .deploy-payload
          rm -f .github/workflows/live-production-diagnostics.yml
          rm -f .github/workflows/apply-atomic-deploy.yml

      - name: Commit hardened production deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make frontend deployment atomic and self-healing"
          git push origin HEAD:fix/atomic-production-deploy
