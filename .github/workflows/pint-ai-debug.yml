name: AI Pint diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pint-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Print exact Pint diff
        run: |
          vendor/bin/pint app/Application/Ai/SafeTechAiAgent.php tests/Feature/AiAssistantApiTest.php
          git diff -- app/Application/Ai/SafeTechAiAgent.php tests/Feature/AiAssistantApiTest.php
          test -z "$(git status --short -- app/Application/Ai/SafeTechAiAgent.php tests/Feature/AiAssistantApiTest.php)"
