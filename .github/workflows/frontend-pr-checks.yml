name: Frontend PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-pr-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_PUBLIC_SITE_URL: "https://safetech.ge"
      NEXT_PUBLIC_API_URL: "https://api.safetech.ge/api"
      BACKEND_API_URL: "https://api.safetech.ge/api"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build with Webpack
        run: npm run build -- --webpack

      - name: Runtime smoke test with production CMS
        run: |
          npm run start -- -p 3000 > /tmp/safetech-next-production.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          status="000"
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /tmp/safetech-home-production.html --write-out '%{http_code}' --max-time 10 http://127.0.0.1:3000/ || true)"
            if [ "${status}" = "200" ]; then
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              echo "Next.js exited before becoming ready."
              cat /tmp/safetech-next-production.log
              exit 1
            fi
            sleep 1
          done

          if [ "${status}" != "200" ]; then
            echo "Homepage returned HTTP ${status} with the production CMS."
            echo "--- Next.js log ---"
            cat /tmp/safetech-next-production.log
            echo "--- Response body ---"
            head -c 5000 /tmp/safetech-home-production.html || true
            exit 1
          fi

          kill "${server_pid}" 2>/dev/null || true
          wait "${server_pid}" 2>/dev/null || true
          trap - EXIT

      - name: Google SEO smoke test with unavailable CMS
        run: |
          BACKEND_API_URL=http://127.0.0.1:9/api npm run start -- -p 3000 > /tmp/safetech-next.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat /tmp/safetech-next.log
              exit 1
            fi
            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
            cat /tmp/safetech-next.log
            exit 1
          fi

          SEO_BASE_URL=http://127.0.0.1:3000 npm run seo:smoke