name: Cleanup schema branch generated assets

on:
  push:
    branches:
      - sitewide-schema-admin-phase-15

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sitewide-schema-admin-phase-15
          fetch-depth: 0
      - name: Restore generated Filament assets from main
        shell: bash
        run: |
          git fetch origin main
          git restore --source=origin/main -- \
            back/public/css/filament \
            back/public/js/filament \
            back/public/fonts/filament
          git clean -fd -- \
            back/public/css/filament \
            back/public/js/filament \
            back/public/fonts/filament
          rm .github/workflows/cleanup-schema-branch.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            back/public/css/filament \
            back/public/js/filament \
            back/public/fonts/filament \
            .github/workflows/cleanup-schema-branch.yml
          git commit -m "Remove generated Filament asset noise"
          git push origin HEAD:sitewide-schema-admin-phase-15
