name: Sitewide schema admin patch

on:
  push:
    branches:
      - sitewide-schema-admin-phase-15

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sitewide-schema-admin-phase-15
      - name: Patch sitewide schema editors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Missing replacement marker in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Service editor: custom override + generated preview.
          replace(
              'back/app/Filament/Resources/ServiceResource.php',
              "use App\\Filament\\Support\\LocalizedContentFields;\nuse App\\Filament\\Support\\NavigationGroup;",
              "use App\\Filament\\Support\\GeneratedSchemaPreview;\nuse App\\Filament\\Support\\LocalizedContentFields;\nuse App\\Filament\\Support\\NavigationGroup;\nuse App\\Filament\\Support\\StructuredDataJsonField;",
          )
          replace(
              'back/app/Filament/Resources/ServiceResource.php',
              "            Section::make('Publishing')\n",
              "            Section::make('Schema JSON-LD')\n                ->description('სერვისის structured data ავტომატურად გენერირდება. Custom override გამოიყენეთ მხოლოდ მაშინ, როცა ავტომატური schema მთლიანად უნდა ჩაანაცვლოთ ან გააფართოოთ.')\n                ->schema([\n                    StructuredDataJsonField::makeAt(\n                        'seo.schema',\n                        'ცარიელი დატოვეთ ავტომატური Schema-სთვის. აქ შეყვანილი JSON frontend-ზე ემატება სერვისის structured data-ს.',\n                    ),\n                    GeneratedSchemaPreview::service(),\n                ]),\n\n            Section::make('Publishing')\n",
          )

          # Project editor.
          replace(
              'back/app/Filament/Resources/ProjectResource.php',
              "use App\\Filament\\Support\\LocalizedContentFields;\nuse App\\Filament\\Support\\NavigationGroup;",
              "use App\\Filament\\Support\\GeneratedSchemaPreview;\nuse App\\Filament\\Support\\LocalizedContentFields;\nuse App\\Filament\\Support\\NavigationGroup;\nuse App\\Filament\\Support\\StructuredDataJsonField;",
          )
          replace(
              'back/app/Filament/Resources/ProjectResource.php',
              "            Section::make('Publishing')\n",
              "            Section::make('Schema JSON-LD')\n                ->description('Project-ის structured data ავტომატურად იქმნება რეალური პროექტის მონაცემებიდან. Override შეავსეთ მხოლოდ სპეციალური შემთხვევისთვის.')\n                ->schema([\n                    StructuredDataJsonField::makeAt(\n                        'seo.schema',\n                        'ცარიელი დატოვეთ ავტომატური Schema-სთვის. Custom JSON frontend-ზე ემატება პროექტის generated structured data-ს.',\n                    ),\n                    GeneratedSchemaPreview::project(),\n                ]),\n\n            Section::make('Publishing')\n",
          )

          # Local SEO landing editor.
          replace(
              'back/app/Filament/Resources/LocalServiceLandingResource.php',
              "use App\\Filament\\Support\\LocalizedContentFields;\nuse App\\Filament\\Support\\NavigationGroup;",
              "use App\\Filament\\Support\\GeneratedSchemaPreview;\nuse App\\Filament\\Support\\LocalizedContentFields;\nuse App\\Filament\\Support\\NavigationGroup;\nuse App\\Filament\\Support\\StructuredDataJsonField;",
          )
          replace(
              'back/app/Filament/Resources/LocalServiceLandingResource.php',
              "                    Toggle::make('noindex')\n",
              "                    StructuredDataJsonField::makeAt(\n                        'schema',\n                        'ცარიელი დატოვეთ ავტომატური Local Service schema-სთვის. Custom JSON გამოიყენეთ მხოლოდ მაშინ, როცა generated schema უნდა ჩაანაცვლოთ ან გააფართოოთ.',\n                    ),\n                    GeneratedSchemaPreview::localService(),\n                    Toggle::make('noindex')\n",
          )

          # Generic Page editor.
          replace(
              'back/app/Filament/Resources/PageResource.php',
              "use App\\Filament\\Support\\LocalizedContentFields;\nuse App\\Filament\\Support\\NavigationGroup;",
              "use App\\Filament\\Support\\GeneratedSchemaPreview;\nuse App\\Filament\\Support\\LocalizedContentFields;\nuse App\\Filament\\Support\\NavigationGroup;\nuse App\\Filament\\Support\\StructuredDataJsonField;",
          )
          replace(
              'back/app/Filament/Resources/PageResource.php',
              "                    TagsInput::make('keywords')->label('Keywords'),\n",
              "                    TagsInput::make('keywords')->label('Keywords'),\n                    StructuredDataJsonField::makeAt(\n                        'schema',\n                        'ცარიელი დატოვეთ ავტომატური WebPage schema-სთვის. Custom override შეავსეთ მხოლოდ მაშინ, როცა generated JSON-LD უნდა შეიცვალოს.',\n                    ),\n                    GeneratedSchemaPreview::page(),\n",
          )

          # Persist schema overrides on pages and local landing pages.
          replace(
              'back/app/Models/Page.php',
              "            'keywords' => 'array',\n            'translations' => 'array',",
              "            'keywords' => 'array',\n            'schema' => 'array',\n            'translations' => 'array',",
          )
          replace(
              'back/app/Models/LocalServiceLanding.php',
              "            'keywords' => 'array',\n            'translations' => 'array',",
              "            'keywords' => 'array',\n            'schema' => 'array',\n            'translations' => 'array',",
          )

          # Expose overrides through the public API.
          replace(
              'back/app/Http/Resources/PageResource.php',
              "                'noindex' => $this->noindex,\n",
              "                'noindex' => $this->noindex,\n                'schema' => $this->schema,\n",
          )
          replace(
              'back/app/Http/Resources/LocalServiceLandingResource.php',
              "                'noindex' => $this->noindex,\n",
              "                'noindex' => $this->noindex,\n                'schema' => $this->schema,\n",
          )

          # Frontend types.
          replace(
              'frontend/src/lib/backend.ts',
              "        noindex?: boolean;\n    };\n};",
              "        noindex?: boolean;\n        schema?: Record<string, unknown> | Array<Record<string, unknown>>;\n    };\n};",
          )
          replace(
              'frontend/src/lib/local-service-landings.ts',
              "        noindex?: boolean;\n    };\n",
              "        noindex?: boolean;\n        schema?: Record<string, unknown> | Array<Record<string, unknown>>;\n    };\n",
          )

          # Local landing JSON-LD: generated by default, override when supplied.
          replace(
              'frontend/src/app/services/[slug]/[location]/page.tsx',
              'import LocalServiceSiblingLinks from "@/components/pages/LocalServiceSiblingLinks";\n',
              'import LocalServiceSiblingLinks from "@/components/pages/LocalServiceSiblingLinks";\nimport JsonLd from "@/components/seo/JsonLd";\n',
          )
          replace(
              'frontend/src/app/services/[slug]/[location]/page.tsx',
              "    return (\n        <>\n            <LocalServiceLandingView landing={landing} locale={locale} />\n",
              "    const generatedSchema = {\n        '@context': 'https://schema.org',\n        '@type': 'Service',\n        name: landing.seo?.title || landing.title,\n        description: landing.seo?.description || landing.excerpt || landing.content,\n        url: `https://safetech.ge/services/${landing.service.slug}/${landing.locationSlug}`,\n        provider: {\n            '@type': 'Organization',\n            '@id': 'https://safetech.ge/#organization',\n            name: 'SafeTech',\n            url: 'https://safetech.ge/',\n        },\n        areaServed: { '@type': 'City', name: landing.locationName },\n    };\n    const schema = landing.seo?.schema || generatedSchema;\n\n    return (\n        <>\n            <JsonLd data={schema} />\n            <LocalServiceLandingView landing={landing} locale={locale} />\n",
          )

          # Dynamic pages get WebPage schema and honor CMS override.
          page_path = Path('frontend/src/app/pages/[slug]/page.tsx')
          page_text = page_path.read_text()
          if 'import JsonLd from "@/components/seo/JsonLd";' not in page_text:
              page_text = page_text.replace(
                  'import type { Metadata } from "next";\n',
                  'import type { Metadata } from "next";\nimport JsonLd from "@/components/seo/JsonLd";\n',
                  1,
              )
          marker = '    return <DynamicPageView page={page} />;'
          if marker in page_text:
              page_text = page_text.replace(
                  marker,
                  "    const generatedSchema = {\n        '@context': 'https://schema.org',\n        '@type': 'WebPage',\n        name: page.seo?.title || page.title,\n        description: page.seo?.description || page.excerpt || page.content,\n        url: `https://safetech.ge/pages/${page.slug}`,\n        isPartOf: { '@type': 'WebSite', name: 'SafeTech', url: 'https://safetech.ge/' },\n    };\n\n    return (\n        <>\n            <JsonLd data={page.seo?.schema || generatedSchema} />\n            <DynamicPageView page={page} />\n        </>\n    );",
                  1,
              )
          else:
              raise SystemExit('Dynamic page return marker not found')
          page_path.write_text(page_text)

          # Database columns for new override locations.
          migration = Path('back/database/migrations/2026_09_07_001000_add_schema_overrides_to_content_pages.php')
          migration.write_text('''<?php\n\nuse Illuminate\\Database\\Migrations\\Migration;\nuse Illuminate\\Database\\Schema\\Blueprint;\nuse Illuminate\\Support\\Facades\\Schema;\n\nreturn new class extends Migration\n{\n    public function up(): void\n    {\n        foreach ([\'pages\', \'local_service_landings\'] as $tableName) {\n            if (! Schema::hasTable($tableName) || Schema::hasColumn($tableName, \'schema\')) {\n                continue;\n            }\n\n            Schema::table($tableName, function (Blueprint $table): void {\n                $table->json(\'schema\')->nullable();\n            });\n        }\n    }\n\n    public function down(): void\n    {\n        foreach ([\'pages\', \'local_service_landings\'] as $tableName) {\n            if (! Schema::hasTable($tableName) || ! Schema::hasColumn($tableName, \'schema\')) {\n                continue;\n            }\n\n            Schema::table($tableName, function (Blueprint $table): void {\n                $table->dropColumn(\'schema\');\n            });\n        }\n    }\n};\n''')

          # Temporary workflow removes itself after applying the patch.
          Path('.github/workflows/sitewide-schema-patch.yml').unlink()
          PY

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add schema controls across public content editors"
          git push origin HEAD:sitewide-schema-admin-phase-15
