name: CCTV planner checks

on:
  pull_request:
    branches: [main]
    paths:
      - "back/app/Support/Calculators/CctvEngineeringCalculator.php"
      - "back/app/Http/Controllers/Api/CameraPlanController.php"
      - "back/app/Models/CameraPlan.php"
      - "back/database/migrations/*camera_plans*"
      - "back/tests/Unit/CctvEngineeringCalculatorTest.php"
      - "back/tests/Feature/CameraPlanApiTest.php"
      - ".github/workflows/cctv-planner-checks.yml"

permissions:
  contents: read

jobs:
  backend-cctv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: back
    env:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      SEED_DEMO_CONTENT: "false"
      XDEBUG_MODE: "off"
    steps:
      - uses: actions/checkout@v7
      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify migrations and isolated CCTV unit/API tests
        run: |
          php artisan migrate:fresh --force
          php artisan test tests/Unit/CctvEngineeringCalculatorTest.php tests/Feature/CameraPlanApiTest.php
