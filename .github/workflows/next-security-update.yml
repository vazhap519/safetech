name: One-time Next.js Security Update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/next-security-update.yml"

permissions:
  contents: write

concurrency:
  group: next-security-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate patched lockfile
        working-directory: frontend
        run: npm install next@16.3.3 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact dependencies
        working-directory: frontend
        run: npm ci --no-fund

      - name: Verify patched Next.js and security audit
        working-directory: frontend
        run: |
          node -e 'const version=require("next/package.json").version; if (version !== "16.3.3") { console.error(`Expected Next.js 16.3.3, found ${version}`); process.exit(1); }'
          npm audit --omit=dev --audit-level=high

      - name: Lint type-check and build
        working-directory: frontend
        env:
          BACKEND_API_URL: http://127.0.0.1:9/api
          NEXT_PUBLIC_API_URL: https://api.safetech.ge/api
          NEXT_PUBLIC_SITE_URL: https://safetech.ge
          REVALIDATE_SECRET: security-update-ci-only
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run check

      - name: Commit patched dependency files and remove updater
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/next-security-update.yml
          git add frontend/package.json frontend/package-lock.json .github/workflows/next-security-update.yml
          if git diff --cached --quiet; then
            echo "No dependency changes were generated." >&2
            exit 1
          fi
          git config user.name "SafeTech Security Updater"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Patch Next.js critical vulnerabilities to 16.3.3"
          git push origin HEAD:main
