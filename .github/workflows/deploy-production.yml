name: Deploy Production

on:
  workflow_run:
    workflows: ["Release Candidate QA"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: safetech-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy QA-approved main commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_SSH_KEY: ${{ secrets.SAFETECH_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.SAFETECH_DEPLOY_KNOWN_HOSTS }}
      DEPLOY_HOST: 95.179.163.147
      DEPLOY_PORT: "22"
      DEPLOY_USER: safetech-deploy
      APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${DEPLOY_SSH_KEY}" && -n "${DEPLOY_KNOWN_HOSTS}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "ready=false" >> "${GITHUB_OUTPUT}"
          {
            echo "### Production deploy blocked"
            echo
            echo "Release Candidate QA passed for \`${APPROVED_SHA}\`, but the SSH deployment secrets are missing."
            echo "Configure \`SAFETECH_DEPLOY_SSH_KEY\` and \`SAFETECH_DEPLOY_KNOWN_HOSTS\` before treating this release as deployed."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Production deployment credentials are not configured." >&2
          exit 1

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${HOME}/.ssh/safetech_deploy"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 0600 "${HOME}/.ssh/safetech_deploy" "${HOME}/.ssh/known_hosts"
          ssh-keygen -y -f "${HOME}/.ssh/safetech_deploy" >/dev/null

      - name: Deploy exact QA-approved commit
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${APPROVED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          ssh \
            -i "${HOME}/.ssh/safetech_deploy" \
            -p "${DEPLOY_PORT}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "deploy ${APPROVED_SHA}"

      - name: Verify public production health and freshness
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            --max-time 20 -o /dev/null "https://safetech.ge/"
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            --max-time 20 "https://api.safetech.ge/api/health" >/tmp/safetech-health.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/safetech-health.json"), true, 512, JSON_THROW_ON_ERROR);
            $approved = getenv("APPROVED_SHA");
            $commit = $data["commit"] ?? null;
            if ($commit !== $approved) {
                fwrite(STDERR, "Production commit mismatch: expected {$approved}, got ".var_export($commit, true).PHP_EOL);
                exit(1);
            }
            if (($data["database"] ?? null) !== "ok") {
                fwrite(STDERR, "Production database health is not OK.".PHP_EOL);
                exit(1);
            }
            $queueStatus = $data["queue"]["status"] ?? "unavailable";
            if (in_array($queueStatus, ["delayed", "unavailable"], true)) {
                fwrite(STDERR, "Production queue health is {$queueStatus}.".PHP_EOL);
                exit(1);
            }
            $failedJobs = $data["queue"]["failed"] ?? null;
            if (is_numeric($failedJobs) && (int) $failedJobs > 0) {
                fwrite(STDERR, "Production queue has {$failedJobs} failed job(s).".PHP_EOL);
                exit(1);
            }
          '
          {
            echo "### Production deploy succeeded"
            echo
            echo "Deployed and verified QA-approved commit: \`${APPROVED_SHA}\`"
            echo "Public homepage, Laravel database health, queue freshness, zero failed queue jobs, and production commit identity passed."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -rf "${HOME}/.ssh/safetech_deploy" "${HOME}/.ssh/known_hosts"
