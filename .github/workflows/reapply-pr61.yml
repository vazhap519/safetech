name: Reapply PR61

on:
  push:
    branches:
      - project-seo-helper-service-context-phase-10
    paths:
      - .github/workflows/reapply-pr61.yml

permissions:
  contents: write

jobs:
  reapply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: back
    env:
      APP_ENV: testing
      APP_KEY: "00000000000000000000000000000000"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout rebased PR branch
        uses: actions/checkout@v7
        with:
          ref: project-seo-helper-service-context-phase-10
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install backend dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Reapply service-aware SEO helper changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('app/Filament/Support/ProjectSeoHelper.php')
          text = helper.read_text()
          text = text.replace(
              """     * @param  array<int, array{name?: mixed, model?: mixed, quantity?: mixed}>  $equipment\n     * @return array{title: string, description: string, imageAlt: string}\n""",
              """     * @param  array<int, array{name?: mixed, model?: mixed, quantity?: mixed}>  $equipment\n     * @param  array<int, mixed>  $services\n     * @return array{title: string, description: string, imageAlt: string, keywords: array<int, string>}\n""",
          )
          text = text.replace(
              """        array $equipment = [],\n    ): array {\n""",
              """        array $equipment = [],\n        array $services = [],\n    ): array {\n""",
          )
          text = text.replace(
              """        $baseDescription = self::clean($description);\n\n        $seoTitle = self::limit($baseTitle, 68);\n\n        if ($city !== '' && ! self::contains($baseTitle, $city)) {\n            $suffix = ' — '.$city;\n            $baseLength = max(1, 68 - mb_strlen($suffix));\n            $seoTitle = self::limit(self::limit($baseTitle, $baseLength).$suffix, 68);\n        }\n""",
              """        $baseDescription = self::clean($description);\n        $serviceNames = collect($services)\n            ->map(fn ($service): string => self::clean($service))\n            ->filter(fn (string $service): bool => $service !== '')\n            ->unique(fn (string $service): string => Str::lower($service))\n            ->values();\n        $primaryService = $serviceNames->first() ?? '';\n\n        $titleCore = collect([\n            $baseTitle,\n            $primaryService !== '' && ! self::contains($baseTitle, $primaryService) ? $primaryService : null,\n        ])->filter()->implode(' — ');\n        $seoTitle = self::limit($titleCore, 68);\n\n        if ($city !== '' && ! self::contains($titleCore, $city)) {\n            $suffix = ' — '.$city;\n            $baseLength = max(1, 68 - mb_strlen($suffix));\n            $seoTitle = self::limit(self::limit($titleCore, $baseLength).$suffix, 68);\n        }\n""",
          )
          text = text.replace(
              """        $context = collect([\n            $objectType !== '' ? $objectType : null,\n""",
              """        $context = collect([\n            $primaryService !== '' ? $primaryService : null,\n            $objectType !== '' ? $objectType : null,\n""",
          )
          text = text.replace(
              """        $altParts = collect([\n            $objectType !== '' ? $objectType : null,\n""",
              """        $altParts = collect([\n            $primaryService !== '' ? $primaryService : null,\n            $objectType !== '' ? $objectType : null,\n""",
          )
          text = text.replace(
              """        return [\n            'title' => $seoTitle,\n            'description' => $seoDescription,\n            'imageAlt' => self::limit($altParts->implode(' — '), 140),\n        ];\n""",
              """        $keywords = collect([\n            ...$serviceNames->all(),\n            $city !== '' ? $city : null,\n            $objectType !== '' ? $objectType : null,\n            ...collect($equipment)\n                ->filter(fn ($item): bool => is_array($item))\n                ->map(fn (array $item): string => self::clean($item['name'] ?? null))\n                ->filter()\n                ->take(5)\n                ->all(),\n        ])\n            ->filter(fn ($value): bool => is_string($value) && trim($value) !== '')\n            ->map(fn (string $value): string => trim($value))\n            ->unique(fn (string $value): string => Str::lower($value))\n            ->take(12)\n            ->values()\n            ->all();\n\n        return [\n            'title' => $seoTitle,\n            'description' => $seoDescription,\n            'imageAlt' => self::limit($altParts->implode(' — '), 140),\n            'keywords' => $keywords,\n        ];\n""",
          )
          helper.write_text(text)

          resource = Path('app/Filament/Resources/ProjectResource.php')
          text = resource.read_text()
          text = text.replace(
              "use Filament\\Forms\\Components\\SpatieMediaLibraryFileUpload;\n",
              "use Filament\\Forms\\Components\\SpatieMediaLibraryFileUpload;\nuse Filament\\Forms\\Components\\TagsInput;\n",
          )
          text = text.replace(
              "SEO Helper ქმნის ქართულ SEO title-ს, meta description-ს და image alt-ს Project name/title, ქალაქის, ობიექტის ტიპისა და ტექნიკის მიხედვით. გენერირებული ტექსტი მხოლოდ ფორმაში ჩაიწერება და შენახვამდე შეგიძლია შეცვალო.",
              "SEO Helper ქმნის ქართულ SEO title-ს, meta description-ს, image alt-ს და keywords-ს Project-ის რეალური მონაცემებისა და შენ მიერ არჩეული Service / City landing-ების მიხედვით. გენერირებული ტექსტი მხოლოდ ფორმაში ჩაიწერება და შენახვამდე შეგიძლია შეცვალო.",
          )
          text = text.replace(
              """                        ->modalDescription('მიმდინარე ფორმაში ქართული SEO title, SEO description და image alt შეიცვლება გენერირებული ვერსიებით. მონაცემები ბაზაში მხოლოდ Save-ის შემდეგ შეინახება.')\n                        ->action(function (Get $get, Set $set): void {\n                            $suggestion = ProjectSeoHelper::suggest(\n""",
              """                        ->modalDescription('მიმდინარე ფორმაში ქართული SEO title, SEO description, image alt და keywords შეიცვლება გენერირებული ვერსიებით. Project-ის Service / City კავშირები გამოიყენება მხოლოდ თუ უკვე შენახულია. მონაცემები ბაზაში მხოლოდ Save-ის შემდეგ შეინახება.')\n                        ->action(function (Get $get, Set $set, ?Project $record): void {\n                            $serviceNames = $record\n                                ? $record->localServiceLandings()\n                                    ->with('service')\n                                    ->get()\n                                    ->map(fn ($landing): ?string => $landing->service?->name ?: $landing->service?->title)\n                                    ->filter()\n                                    ->unique()\n                                    ->values()\n                                    ->all()\n                                : [];\n\n                            $suggestion = ProjectSeoHelper::suggest(\n""",
          )
          text = text.replace(
              """                                is_array($get('equipment')) ? $get('equipment') : [],\n                            );\n\n                            $set('translations.fields.seoTitle.ka', $suggestion['title']);\n                            $set('seo_description', $suggestion['description']);\n                            $set('image_alt', $suggestion['imageAlt']);\n\n                            Notification::make()\n                                ->title('SEO ტექსტები ფორმაში ჩაიწერა')\n                                ->body('შეამოწმე და სურვილის შემთხვევაში ჩაასწორე, შემდეგ დააჭირე Save-ს.')\n""",
              """                                is_array($get('equipment')) ? $get('equipment') : [],\n                                $serviceNames,\n                            );\n\n                            $set('translations.fields.seoTitle.ka', $suggestion['title']);\n                            $set('seo_description', $suggestion['description']);\n                            $set('image_alt', $suggestion['imageAlt']);\n                            $set('seo.keywords', $suggestion['keywords']);\n\n                            Notification::make()\n                                ->title('SEO ტექსტები ფორმაში ჩაიწერა')\n                                ->body($serviceNames\n                                    ? 'SEO-ში გამოყენებულია შენ მიერ არჩეული Service / City კავშირებიც. შეამოწმე და შემდეგ დააჭირე Save-ს.'\n                                    : 'Service / City კავშირი ჯერ არ არის არჩეული. SEO შეიქმნა პროექტის სხვა რეალური მონაცემებით.')\n""",
          )
          text = text.replace(
              """                    ...LocalizedContentFields::inputs('seoTitle', 'SEO title'),\n                    ...LocalizedContentFields::inputs('card.title', 'Card title'),\n""",
              """                    ...LocalizedContentFields::inputs('seoTitle', 'SEO title'),\n                    TagsInput::make('seo.keywords')\n                        ->label('SEO keywords')\n                        ->helperText('SEO Helper ავტომატურად აერთიანებს არჩეულ სერვისებს, ქალაქს, ობიექტის ტიპსა და ტექნიკას. სურვილის შემთხვევაში შეგიძლია ხელით ჩაასწორო.')\n                        ->columnSpanFull(),\n                    ...LocalizedContentFields::inputs('card.title', 'Card title'),\n""",
          )
          resource.write_text(text)

          Path('tests/Unit/ProjectSeoHelperTest.php').write_text(r'''<?php

namespace Tests\Unit;

use App\Filament\Support\ProjectSeoHelper;
use PHPUnit\Framework\TestCase;

class ProjectSeoHelperTest extends TestCase
{
    public function test_it_builds_suggestions_from_verified_project_facts(): void
    {
        $result = ProjectSeoHelper::suggest(
            'Bakuriani cottage CCTV',
            '6 კამერიანი TVT 4MP Full Color ვიდეოსამეთვალყურეო სისტემა',
            'კოტეჯისთვის დამონტაჟდა სრული ვიდეოსამეთვალყურეო სისტემა.',
            'ბაკურიანი',
            'კოტეჯი',
            [
                ['name' => 'TVT Full Color კამერა', 'model' => 'TD-9444', 'quantity' => '6 ცალი'],
                ['name' => 'TVT PoE NVR', 'model' => '8-port', 'quantity' => '1 ცალი'],
            ],
            ['უსაფრთხოების კამერების მონტაჟი'],
        );

        $this->assertStringContainsString('ბაკურიანი', $result['title']);
        $this->assertStringContainsString('უსაფრთხოების კამერების მონტაჟი', $result['description']);
        $this->assertStringContainsString('კოტეჯი', $result['description']);
        $this->assertStringContainsString('TVT Full Color კამერა', $result['description']);
        $this->assertStringContainsString('SafeTech', $result['imageAlt']);
        $this->assertContains('უსაფრთხოების კამერების მონტაჟი', $result['keywords']);
        $this->assertContains('ბაკურიანი', $result['keywords']);
        $this->assertContains('TVT Full Color კამერა', $result['keywords']);
        $this->assertLessThanOrEqual(68, mb_strlen($result['title']));
        $this->assertLessThanOrEqual(170, mb_strlen($result['description']));
        $this->assertLessThanOrEqual(140, mb_strlen($result['imageAlt']));
    }

    public function test_it_does_not_duplicate_city_when_headline_already_contains_it(): void
    {
        $result = ProjectSeoHelper::suggest(
            null,
            'კამერების მონტაჟი ბაკურიანში',
            null,
            'ბაკურიანი',
            'კოტეჯი',
            [],
            ['კამერების მონტაჟი'],
        );

        $this->assertSame(1, mb_substr_count(mb_strtolower($result['title']), 'ბაკურიანი'));
    }

    public function test_it_uses_only_first_curated_service_in_title_but_keeps_all_as_keywords(): void
    {
        $result = ProjectSeoHelper::suggest(
            'ბიზნეს ობიექტის პროექტი',
            'ბიზნეს ობიექტის ინფრასტრუქტურა',
            null,
            'თბილისი',
            'მაღაზია',
            [],
            ['ქსელის გაყვანა', 'Wi-Fi და როუტერის გამართვა', 'ქსელის გაყვანა'],
        );

        $this->assertStringContainsString('ქსელის გაყვანა', $result['title']);
        $this->assertContains('ქსელის გაყვანა', $result['keywords']);
        $this->assertContains('Wi-Fi და როუტერის გამართვა', $result['keywords']);
        $this->assertSame(1, count(array_filter($result['keywords'], fn (string $keyword): bool => $keyword === 'ქსელის გაყვანა')));
    }
}
''')
          PY

      - name: Format and test helper changes
        run: |
          vendor/bin/pint app/Filament/Support/ProjectSeoHelper.php app/Filament/Resources/ProjectResource.php tests/Unit/ProjectSeoHelperTest.php
          php artisan test tests/Unit/ProjectSeoHelperTest.php tests/Feature/RelatedProjectDefaultsTest.php

      - name: Commit rebased PR changes
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add back/app/Filament/Support/ProjectSeoHelper.php back/app/Filament/Resources/ProjectResource.php back/tests/Unit/ProjectSeoHelperTest.php
          git diff --cached --quiet && exit 0
          git commit -m "Use curated service context in Project SEO Helper"
          git push origin HEAD:project-seo-helper-service-context-phase-10
