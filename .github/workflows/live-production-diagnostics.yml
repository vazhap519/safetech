name: Live production diagnostics

on:
  push:
    branches:
      - fix/atomic-production-deploy
    paths:
      - ".github/workflows/live-production-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_PUBLIC_SITE_URL: "https://safetech.ge"
      NEXT_PUBLIC_API_URL: "https://api.safetech.ge/api"
      BACKEND_API_URL: "https://api.safetech.ge/api"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Probe live DNS, frontend and API
        shell: bash
        run: |
          set -u
          for host in safetech.ge api.safetech.ge; do
            echo "=== DNS: ${host} ==="
            getent ahosts "${host}" || true
          done

          for url in \
            https://safetech.ge/ \
            https://safetech.ge/about \
            https://api.safetech.ge/api/health \
            https://api.safetech.ge/api/services \
            https://api.safetech.ge/api/projects; do
            echo
            echo "=== ${url} ==="
            curl --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --dump-header /tmp/headers.txt \
              --output /tmp/body.txt \
              --write-out 'HTTP=%{http_code} TYPE=%{content_type} IP=%{remote_ip} TIME=%{time_total}\n' \
              "${url}" || true
            cat /tmp/headers.txt || true
            echo "--- body (first 5000 bytes) ---"
            head -c 5000 /tmp/body.txt || true
            echo
          done

      - name: Install and build current frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build -- --webpack

      - name: Reproduce locally against live CMS
        working-directory: frontend
        shell: bash
        run: |
          set -u
          rm -f /tmp/safetech-local-next.log /tmp/safetech-local-body.txt
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/safetech-local-next.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          status=000
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /tmp/safetech-local-body.txt --write-out '%{http_code}' --max-time 15 http://127.0.0.1:3000/ || true)"
            if [[ "${status}" != "000" ]]; then
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          echo "LOCAL_HTTP=${status}"
          echo "=== Next.js runtime log ==="
          cat /tmp/safetech-local-next.log || true
          echo "=== Local response body ==="
          head -c 10000 /tmp/safetech-local-body.txt || true
          echo

          [[ "${status}" == "200" ]]
