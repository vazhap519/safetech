name: Temporary Pint Fix

on:
  push:
    branches:
      - security-php-dependencies-phase-11
    paths:
      - .github/workflows/temporary-pint-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: security-php-dependencies-phase-11
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PHP dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format only the two legacy SEO migrations
        run: |
          vendor/bin/pint database/migrations/2026_09_05_163000_strengthen_cctv_local_seo_landings.php database/migrations/2026_09_05_173000_expand_priority_local_seo_landings.php

      - name: Commit formatting-only changes
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add back/database/migrations/2026_09_05_163000_strengthen_cctv_local_seo_landings.php back/database/migrations/2026_09_05_173000_expand_priority_local_seo_landings.php
          git diff --cached --quiet && exit 0
          git commit -m "Format legacy Local SEO migrations"
          git push origin HEAD:security-php-dependencies-phase-11
